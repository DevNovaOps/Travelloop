{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Travelloop</title>
  <link rel="icon" href="{% static 'assets/images/logo.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob--1"></div><div class="blob blob--2"></div><div class="blob blob--3"></div></div>
  <canvas class="stars-canvas" id="starsCanvas"></canvas>
  <div class="auth-page">
    <div class="auth-card glass-card glass-card--glow animate-scaleIn" style="max-width:440px;">
      <div class="auth-card__header">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(34,197,94,0.1);border:2px solid var(--success);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);">
          <i data-lucide="lock-keyhole" style="width:32px;height:32px;color:var(--success);"></i>
        </div>
        <h2>Set New Password</h2>
        <p>Create a strong password for your account</p>
      </div>
      <form class="auth-form" id="resetForm" onsubmit="return handleReset(event)">
        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="new-password" placeholder="Min. 8 characters" required minlength="8" style="padding-left:40px;" />
            <i data-lucide="lock" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-dim);"></i>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <div style="position:relative;">
            <input class="form-input" type="password" id="confirm-password" placeholder="Re-enter password" required minlength="8" style="padding-left:40px;" />
            <i data-lucide="lock" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-dim);"></i>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;">
          <i data-lucide="check" style="width:18px;height:18px;"></i> Update Password
        </button>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    async function handleReset(e) {
      e.preventDefault();
      const pw = document.getElementById('new-password').value;
      const cpw = document.getElementById('confirm-password').value;
      if (pw !== cpw) { showToast('Passwords do not match', 'error'); return false; }
      const email = sessionStorage.getItem('reset_email') || '';
      try {
        const res = await fetch('/api/reset-password/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pw }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('Password updated! Redirecting to login...', 'success');
          sessionStorage.removeItem('reset_email');
          setTimeout(() => window.location.href = "{% url 'login' %}", 1500);
        } else {
          showToast(data.error || 'Failed to reset password', 'error');
        }
      } catch (err) { showToast('Network error.', 'error'); }
      return false;
    }
  </script>
</body>
</html>
