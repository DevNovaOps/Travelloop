{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify OTP — Travelloop</title>
  <link rel="icon" href="{% static 'assets/images/logo.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .otp-inputs { display:flex; gap:12px; justify-content:center; margin:var(--sp-4) 0; }
    .otp-inputs input {
      width:52px; height:60px; text-align:center; font-size:1.5rem; font-weight:700;
      background:var(--card-bg); border:2px solid var(--glass-border); border-radius:var(--radius-md);
      color:var(--text-main); outline:none; transition:border-color 0.2s;
    }
    .otp-inputs input:focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(6,182,212,0.15); }
  </style>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob--1"></div><div class="blob blob--2"></div><div class="blob blob--3"></div></div>
  <canvas class="stars-canvas" id="starsCanvas"></canvas>
  <div class="auth-page">
    <div class="auth-card glass-card glass-card--glow animate-scaleIn" style="max-width:440px;">
      <div class="auth-card__header">
        <div style="width:72px;height:72px;border-radius:50%;background:rgba(6,182,212,0.1);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-4);">
          <i data-lucide="shield-check" style="width:32px;height:32px;color:var(--cyan);"></i>
        </div>
        <h2>Verify OTP</h2>
        <p>Enter the 6-digit code sent to <strong id="displayEmail">your email</strong></p>
      </div>
      <form class="auth-form" id="otpForm" onsubmit="return handleVerifyOTP(event)">
        <div class="otp-inputs" id="otpInputs">
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" autofocus />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
          <input type="text" maxlength="1" inputmode="numeric" pattern="[0-9]" />
        </div>
        <p class="text-sm text-muted" style="text-align:center;">Code expires in <strong id="timer" style="color:var(--cyan);">10:00</strong></p>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;margin-top:var(--sp-4);">
          <i data-lucide="check-circle" style="width:18px;height:18px;"></i> Verify OTP
        </button>
        <div class="auth-form__footer">
          Didn't receive code? <a href="#" onclick="resendOTP(event)">Resend OTP</a>
        </div>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    const email = sessionStorage.getItem('reset_email') || '';
    document.getElementById('displayEmail').textContent = email || 'your email';

    // OTP input auto-focus
    const inputs = document.querySelectorAll('.otp-inputs input');
    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
      });
      inp.addEventListener('paste', (e) => {
        const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
        if (paste.length === 6 && /^\d+$/.test(paste)) {
          inputs.forEach((el, j) => el.value = paste[j]);
          inputs[5].focus();
          e.preventDefault();
        }
      });
    });

    // Countdown timer
    let seconds = 600;
    const timerEl = document.getElementById('timer');
    const interval = setInterval(() => {
      seconds--;
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      timerEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
      if (seconds <= 0) { clearInterval(interval); timerEl.textContent = 'Expired'; timerEl.style.color = 'var(--danger)'; }
    }, 1000);

    async function handleVerifyOTP(e) {
      e.preventDefault();
      const otp = Array.from(inputs).map(i => i.value).join('');
      if (otp.length !== 6) { showToast('Please enter all 6 digits', 'error'); return false; }
      try {
        const res = await fetch('/api/verify-otp/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast('OTP verified! Set your new password.', 'success');
          setTimeout(() => window.location.href = "{% url 'reset_password' %}", 1200);
        } else {
          showToast(data.error || 'Invalid OTP', 'error');
        }
      } catch (err) { showToast('Network error.', 'error'); }
      return false;
    }

    async function resendOTP(e) {
      e.preventDefault();
      try {
        const res = await fetch('/api/forgot-password/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        showToast(data.message || 'OTP resent!', 'success');
        seconds = 600;
      } catch (err) { showToast('Failed to resend', 'error'); }
    }
  </script>
</body>
</html>
