{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Travelloop</title>
  <link rel="icon" href="{% static 'assets/images/logo.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="bg-blobs"><div class="blob blob--1"></div><div class="blob blob--2"></div><div class="blob blob--3"></div></div>
  <canvas class="stars-canvas" id="starsCanvas"></canvas>
  <div class="auth-page">
    <div class="auth-card glass-card glass-card--glow animate-scaleIn" style="max-width:440px;">
      <div class="auth-card__header">
        <a href="{% url 'index' %}" style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-3);text-decoration:none;margin-bottom:var(--sp-4);">
          <div class="tl-logo tl-logo--xl"><img src="{% static 'assets/images/logo.svg' %}" alt="Travelloop" /></div>
          <span class="tl-brand-text" style="font-size:1.75rem;"><span class="text-travel">Travel</span><span class="text-loop">l<span class="text-oo">oo</span>p</span></span>
        </a>
        <h2>Forgot Password</h2>
        <p>Enter your email and we'll send you an OTP to reset your password</p>
      </div>
      <form class="auth-form" id="forgotForm" onsubmit="return handleForgot(event)">
        <div class="form-group">
          <label class="form-label" for="forgot-email">Email Address</label>
          <div style="position:relative;">
            <input class="form-input" type="email" id="forgot-email" placeholder="traveler@example.com" required style="padding-left:40px;" />
            <i data-lucide="mail" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-dim);"></i>
          </div>
        </div>
        <button type="submit" class="btn btn--primary btn--lg" style="width:100%;" id="sendOtpBtn">
          <i data-lucide="send" style="width:18px;height:18px;"></i> Send OTP
        </button>
        <div class="auth-form__footer">
          Remember your password? <a href="{% url 'login' %}">Sign in</a>
        </div>
      </form>
    </div>
  </div>
  <div class="toast-container" id="toastContainer"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    async function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgot-email').value;
      const btn = document.getElementById('sendOtpBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Sending...';
      try {
        const res = await fetch('/api/forgot-password/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (res.ok && data.success) {
          showToast(data.message || 'OTP sent to your email!', 'success');
          sessionStorage.setItem('reset_email', email);
          setTimeout(() => window.location.href = "{% url 'verify_otp' %}", 1500);
        } else {
          showToast(data.error || 'Failed to send OTP', 'error');
        }
      } catch (err) {
        showToast('Network error. Please try again.', 'error');
      }
      btn.disabled = false;
      btn.innerHTML = '<i data-lucide="send" style="width:18px;height:18px;"></i> Send OTP';
      if (typeof lucide !== 'undefined') lucide.createIcons();
      return false;
    }
  </script>
</body>
</html>
