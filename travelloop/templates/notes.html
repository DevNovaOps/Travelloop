{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Notes — Travelloop</title>
  <meta name="description" content="Keep a travel journal — organize notes by trip, day, or stop." />
  <link rel="icon" href="{% static 'assets/images/logo.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <link rel="stylesheet" href="{% static 'css/pages.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-layout">
    <aside class="page-sidebar" id="sidebar">
      <a href="{% url 'index' %}" class="sidebar__brand">
        <div class="tl-logo tl-logo--sm"><img src="{% static 'assets/images/logo.svg' %}" alt="Travelloop" /></div>
        <span class="tl-brand-text" style="font-size:1.25rem;"><span class="text-travel">Travel</span><span class="text-loop">l<span class="text-oo">oo</span>p</span></span>
      </a>
      <nav class="sidebar__nav">
        <a href="{% url 'dashboard' %}" class="sidebar__link"><i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i> Overview</a>
        <a href="{% url 'trips' %}" class="sidebar__link"><i data-lucide="map" style="width:20px;height:20px;"></i> My Trips</a>
        <a href="{% url 'create_trip' %}" class="sidebar__link"><i data-lucide="plus-circle" style="width:20px;height:20px;"></i> New Trip</a>
        <a href="{% url 'packing' %}" class="sidebar__link"><i data-lucide="check-square" style="width:20px;height:20px;"></i> Packing</a>
        <a href="{% url 'notes' %}" class="sidebar__link active"><i data-lucide="notebook-pen" style="width:20px;height:20px;"></i> Notes</a>
        <a href="{% url 'community' %}" class="sidebar__link"><i data-lucide="users" style="width:20px;height:20px;"></i> Community</a>
        <a href="{% url 'search' %}" class="sidebar__link"><i data-lucide="search" style="width:20px;height:20px;"></i> Explore</a>
        <a href="{% url 'invoices' %}" class="sidebar__link"><i data-lucide="receipt" style="width:20px;height:20px;"></i> Invoices</a>
        <a href="{% url 'profile' %}" class="sidebar__link"><i data-lucide="user" style="width:20px;height:20px;"></i> Profile</a>
      </nav>
      <div style="border-top:1px solid var(--glass-border);padding-top:var(--sp-4);margin-top:auto;">
        <div class="flex items-center gap-3" style="padding:var(--sp-2) var(--sp-3);">
          <div class="avatar" id="sidebarAvatar">T</div>
          <div><div class="text-sm font-semi" id="sidebarName">Traveler</div><div class="text-xs text-muted">user@travelloop.com</div></div>
          <button class="theme-toggle" id="themeToggle" style="margin-left:auto;width:32px;height:32px;" aria-label="Toggle theme"><i data-lucide="sun" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
    </aside>

    <main class="page-content">
      <div class="search-toolbar">
        <i data-lucide="search" style="width:18px;height:18px;color:var(--text-dim);flex-shrink:0;"></i>
        <input class="search-toolbar__input" type="text" placeholder="Search notes..." id="noteSearch" />
        <div class="search-toolbar__actions">
          <button class="toolbar-btn" id="groupByBtn"><i data-lucide="layout-grid" style="width:14px;height:14px;"></i> Group by</button>
          <button class="toolbar-btn" id="filterBtn"><i data-lucide="filter" style="width:14px;height:14px;"></i> Filter</button>
          <button class="toolbar-btn" id="sortByBtn"><i data-lucide="arrow-up-down" style="width:14px;height:14px;"></i> Sort by</button>
        </div>
      </div>

      <div class="section-header">
        <div>
          <h1 class="section-header__title">Trip Notes</h1>
          <p class="section-header__subtitle">Your personal travel journal</p>
        </div>
        <button class="btn btn--primary" id="addNoteBtn"><i data-lucide="plus" style="width:18px;height:18px;"></i> Add Note</button>
      </div>

      <div class="flex gap-4 mb-4 items-center flex-wrap">
        <select class="form-input" style="max-width:280px;" id="noteTripSelect">
          <option value="">Loading trips...</option>
        </select>
        <div class="note-filters">
          <button class="note-filter active" data-filter="all">All</button>
          <button class="note-filter" data-filter="day">by Day</button>
          <button class="note-filter" data-filter="stop">by Stop</button>
        </div>
      </div>

      <div id="notesContainer"></div>
    </main>
  </div>

  <!-- Add/Edit Note Modal -->
  <div class="modal-overlay" id="noteModal" style="display:none;">
    <div class="glass-card p-6" style="width:520px;max-width:90vw;">
      <h3 id="noteModalTitle" style="margin-bottom:var(--sp-4);">Add Note</h3>
      <div class="form-group mb-4">
        <label class="form-label">Title</label>
        <input class="form-input" type="text" id="modalNoteTitle" placeholder="e.g. Hotel check-in details" />
      </div>
      <div class="form-group mb-4">
        <label class="form-label">Content</label>
        <textarea class="form-input" rows="4" id="modalNoteBody" placeholder="Write your note here..."></textarea>
      </div>
      <div class="grid grid-2 gap-4 mb-4">
        <div class="form-group">
          <label class="form-label">Day Label</label>
          <input class="form-input" type="text" id="modalNoteDay" placeholder="e.g. Day 1" />
        </div>
        <div class="form-group">
          <label class="form-label">Stop / Location</label>
          <input class="form-input" type="text" id="modalNoteStop" placeholder="e.g. Paris" />
        </div>
      </div>
      <div class="flex gap-3" style="justify-content:flex-end;">
        <button class="btn btn--ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn--primary" id="modalSaveBtn">Save Note</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    let currentTripId = null;
    let notes = [];
    let editingNoteId = null;
    let sortMode = 'newest';
    let groupMode = 'none';

    // User info
    (async()=>{try{const r=await fetch('/api/profile/');if(r.ok){const u=await r.json();const n=`${u.firstName||''} ${u.lastName||''}`.trim()||'Traveler';document.getElementById('sidebarName').textContent=n;document.getElementById('sidebarAvatar').textContent=n.charAt(0).toUpperCase();}}catch(e){}})();

    // ── Load trips ──
    async function loadTrips() {
      try {
        const r = await fetch('/api/trips/');
        if (!r.ok) return;
        const d = await r.json();
        const sel = document.getElementById('noteTripSelect');
        sel.innerHTML = '';
        if (!d.trips || d.trips.length === 0) {
          sel.innerHTML = '<option value="">No trips yet</option>';
          return;
        }
        d.trips.forEach(t => {
          const o = document.createElement('option');
          o.value = t.id; o.textContent = `Trip: ${t.name}`;
          sel.appendChild(o);
        });
        currentTripId = d.trips[0].id;
        loadNotes();
      } catch(e){}
    }

    document.getElementById('noteTripSelect').addEventListener('change', (e) => {
      currentTripId = e.target.value;
      if (currentTripId) loadNotes();
    });

    // ── Load notes from backend ──
    async function loadNotes() {
      if (!currentTripId) return;
      try {
        const r = await fetch(`/api/trips/${currentTripId}/notes/`);
        if (!r.ok) throw new Error();
        const d = await r.json();
        notes = (d.notes||[]).map(n => ({
          id: n.id, title: n.title, body: n.body,
          day: n.dayLabel||'', stop: n.stop||'',
          date: new Date(n.createdAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}),
        }));
        renderNotes();
      } catch(e){ console.error(e); }
    }

    function renderNotes() {
      const container = document.getElementById('notesContainer');
      const search = document.getElementById('noteSearch').value.toLowerCase();
      const filter = document.querySelector('.note-filter.active')?.dataset.filter || 'all';
      container.innerHTML = '';

      let filtered = notes.filter(n => {
        if (search && !n.title.toLowerCase().includes(search) && !n.body.toLowerCase().includes(search)) return false;
        return true;
      });

      if (sortMode === 'alpha') filtered.sort((a,b)=>a.title.localeCompare(b.title));
      else if (sortMode === 'newest') filtered.sort((a,b)=>(b.id||0)-(a.id||0));

      if (filter === 'day' || groupMode === 'day') {
        const groups = {};
        filtered.forEach(n => { const k = n.day||'Unspecified'; (groups[k]=groups[k]||[]).push(n); });
        Object.entries(groups).forEach(([label, items]) => {
          container.innerHTML += `<div class="trip-status-label trip-status-label--upcoming" style="margin:var(--sp-4) 0 var(--sp-2);"><i data-lucide="calendar" style="width:14px;height:14px;"></i> ${label}</div>`;
          items.forEach((n,i) => container.appendChild(createNoteCard(n,i)));
        });
      } else if (filter === 'stop' || groupMode === 'stop') {
        const groups = {};
        filtered.forEach(n => { const k = n.stop||'General'; (groups[k]=groups[k]||[]).push(n); });
        Object.entries(groups).forEach(([label, items]) => {
          container.innerHTML += `<div class="trip-status-label trip-status-label--ongoing" style="margin:var(--sp-4) 0 var(--sp-2);"><i data-lucide="map-pin" style="width:14px;height:14px;"></i> ${label}</div>`;
          items.forEach((n,i) => container.appendChild(createNoteCard(n,i)));
        });
      } else {
        if (filtered.length === 0) {
          container.innerHTML = '<div class="glass-card p-6" style="text-align:center;"><p class="text-muted">No notes yet. Add your first note!</p></div>';
        }
        filtered.forEach((n,i) => container.appendChild(createNoteCard(n,i)));
      }
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function createNoteCard(n, i) {
      const card = document.createElement('div');
      card.className = `note-card glass-card glass-card--glow animate-fadeInUp delay-${Math.min((i%6)+1,4)}`;
      card.innerHTML = `
        <div class="note-card__header">
          <div class="note-card__title">${n.title||'Untitled'}</div>
          <div class="note-card__actions">
            <button class="btn btn--ghost btn--sm" title="Edit" onclick="editNote(${n.id})"><i data-lucide="pencil" style="width:14px;height:14px;"></i></button>
            <button class="btn btn--ghost btn--sm" title="Delete" onclick="deleteNote(${n.id},'${(n.title||'').replace(/'/g,"\\'")}')"><i data-lucide="trash-2" style="width:14px;height:14px;color:var(--danger);"></i></button>
          </div>
        </div>
        <div class="note-card__body">${n.body||''}</div>
        <div class="flex gap-3 items-center">
          <span class="note-card__date"><i data-lucide="calendar" style="width:12px;height:12px;display:inline;vertical-align:middle;"></i> ${n.date}</span>
          ${n.day?`<span class="badge badge--cyan" style="font-size:0.65rem;">${n.day}</span>`:''}
          ${n.stop?`<span class="badge badge--purple" style="font-size:0.65rem;">${n.stop}</span>`:''}
        </div>`;
      return card;
    }

    // ── Modal ──
    function openModal() { document.getElementById('noteModal').style.display = 'flex'; }
    function closeModal() {
      document.getElementById('noteModal').style.display = 'none';
      editingNoteId = null;
      document.getElementById('modalNoteTitle').value = '';
      document.getElementById('modalNoteBody').value = '';
      document.getElementById('modalNoteDay').value = '';
      document.getElementById('modalNoteStop').value = '';
      document.getElementById('noteModalTitle').textContent = 'Add Note';
    }

    document.getElementById('addNoteBtn').addEventListener('click', () => {
      editingNoteId = null;
      document.getElementById('noteModalTitle').textContent = 'Add Note';
      openModal();
    });

    function editNote(id) {
      const n = notes.find(x => x.id === id);
      if (!n) return;
      editingNoteId = id;
      document.getElementById('noteModalTitle').textContent = 'Edit Note';
      document.getElementById('modalNoteTitle').value = n.title;
      document.getElementById('modalNoteBody').value = n.body;
      document.getElementById('modalNoteDay').value = n.day;
      document.getElementById('modalNoteStop').value = n.stop;
      openModal();
    }

    document.getElementById('modalSaveBtn').addEventListener('click', async () => {
      const title = document.getElementById('modalNoteTitle').value.trim();
      const body = document.getElementById('modalNoteBody').value.trim();
      const day = document.getElementById('modalNoteDay').value.trim();
      const stop = document.getElementById('modalNoteStop').value.trim();
      if (!title) { showToast('Enter a note title','error'); return; }
      if (!currentTripId) { showToast('Select a trip first','error'); return; }

      const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';
      const payload = { title, body, dayLabel: day, stop };

      try {
        if (editingNoteId) {
          await fetch(`/api/trips/${currentTripId}/notes/${editingNoteId}/`, {
            method:'PUT', headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
            body: JSON.stringify(payload),
          });
          showToast('Note updated!','success');
        } else {
          await fetch(`/api/trips/${currentTripId}/notes/`, {
            method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
            body: JSON.stringify(payload),
          });
          showToast('Note added! 📝','success');
        }
        closeModal();
        loadNotes();
      } catch(e){ showToast('Failed to save note','error'); }
    });

    async function deleteNote(id, title) {
      if (!currentTripId) return;
      const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';
      try {
        await fetch(`/api/trips/${currentTripId}/notes/${id}/`, { method:'DELETE', headers:{'X-CSRFToken':csrf} });
        notes = notes.filter(n => n.id !== id);
        renderNotes();
        showToast(`"${title}" deleted`,'info');
      } catch(e){}
    }

    // ── Toolbar ──
    document.getElementById('sortByBtn').addEventListener('click', () => {
      sortMode = sortMode === 'alpha' ? 'newest' : 'alpha';
      renderNotes();
      showToast(`Sorted ${sortMode === 'alpha' ? 'A-Z' : 'newest first'}`,'info');
    });
    document.getElementById('filterBtn').addEventListener('click', () => {
      showToast('Use the filter tabs (All / by Day / by Stop) below','info');
    });
    document.getElementById('groupByBtn').addEventListener('click', () => {
      const modes = ['none','day','stop'];
      groupMode = modes[(modes.indexOf(groupMode)+1) % modes.length];
      renderNotes();
      showToast(`Grouped by: ${groupMode === 'none' ? 'none' : groupMode}`,'info');
    });

    document.querySelectorAll('.note-filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.note-filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderNotes();
      });
    });

    document.getElementById('noteSearch').addEventListener('input', () => renderNotes());
    document.getElementById('noteModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeModal(); });

    loadTrips();
  </script>
</body>
</html>
