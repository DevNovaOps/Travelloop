{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — Travelloop</title>
  <meta name="description" content="Share your travel experiences and connect with fellow travelers." />
  <link rel="icon" href="{% static 'assets/images/logo.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <link rel="stylesheet" href="{% static 'css/pages.css' %}" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-layout">
    <aside class="page-sidebar" id="sidebar">
      <a href="{% url 'index' %}" class="sidebar__brand">
        <div class="tl-logo tl-logo--sm"><img src="{% static 'assets/images/logo.svg' %}" alt="Travelloop" /></div>
        <span class="tl-brand-text" style="font-size:1.25rem;"><span class="text-travel">Travel</span><span class="text-loop">l<span class="text-oo">oo</span>p</span></span>
      </a>
      <nav class="sidebar__nav">
        <a href="{% url 'dashboard' %}" class="sidebar__link"><i data-lucide="layout-dashboard" style="width:20px;height:20px;"></i> Overview</a>
        <a href="{% url 'trips' %}" class="sidebar__link"><i data-lucide="map" style="width:20px;height:20px;"></i> My Trips</a>
        <a href="{% url 'create_trip' %}" class="sidebar__link"><i data-lucide="plus-circle" style="width:20px;height:20px;"></i> New Trip</a>
        <a href="{% url 'packing' %}" class="sidebar__link"><i data-lucide="check-square" style="width:20px;height:20px;"></i> Packing</a>
        <a href="{% url 'notes' %}" class="sidebar__link"><i data-lucide="notebook-pen" style="width:20px;height:20px;"></i> Notes</a>
        <a href="{% url 'community' %}" class="sidebar__link active"><i data-lucide="users" style="width:20px;height:20px;"></i> Community</a>
        <a href="{% url 'search' %}" class="sidebar__link"><i data-lucide="search" style="width:20px;height:20px;"></i> Explore</a>
        <a href="{% url 'invoices' %}" class="sidebar__link"><i data-lucide="receipt" style="width:20px;height:20px;"></i> Invoices</a>
        <a href="{% url 'profile' %}" class="sidebar__link"><i data-lucide="user" style="width:20px;height:20px;"></i> Profile</a>
      </nav>
      <div style="border-top:1px solid var(--glass-border);padding-top:var(--sp-4);margin-top:auto;">
        <div class="flex items-center gap-3" style="padding:var(--sp-2) var(--sp-3);">
          <div class="avatar" id="sidebarAvatar">T</div>
          <div><div class="text-sm font-semi" id="sidebarName">Traveler</div><div class="text-xs text-muted">user@travelloop.com</div></div>
          <button class="theme-toggle" id="themeToggle" style="margin-left:auto;width:32px;height:32px;" aria-label="Toggle theme"><i data-lucide="sun" style="width:16px;height:16px;"></i></button>
        </div>
      </div>
    </aside>

    <main class="page-content">
      <div class="section-header">
        <div>
          <h1 class="section-header__title">Community</h1>
          <p class="section-header__subtitle">Share experiences and connect with fellow travelers</p>
        </div>
        <button class="btn btn--primary" id="newPostBtn"><i data-lucide="plus" style="width:18px;height:18px;"></i> New Post</button>
      </div>

      <div class="search-toolbar">
        <i data-lucide="search" style="width:18px;height:18px;color:var(--text-dim);flex-shrink:0;"></i>
        <input class="search-toolbar__input" type="text" placeholder="Search community posts..." id="communitySearch" />
        <div class="search-toolbar__actions">
          <button class="toolbar-btn" id="sortByBtn"><i data-lucide="arrow-up-down" style="width:14px;height:14px;"></i> Sort by</button>
        </div>
      </div>

      <!-- New Post Composer -->
      <div class="glass-card glass-card--glow p-6 mb-6" id="postComposer" style="display:none;">
        <textarea class="form-input" rows="3" placeholder="Share your travel experience..." id="postText"></textarea>
        <div class="form-group mt-4">
          <input class="form-input" type="text" placeholder="Trip name (optional)" id="postTripName" style="max-width:300px;" />
        </div>
        <div class="flex justify-between items-center mt-4">
          <button class="btn btn--ghost btn--sm" onclick="document.getElementById('postComposer').style.display='none'">Cancel</button>
          <button class="btn btn--primary btn--sm" id="submitPostBtn"><i data-lucide="send" style="width:14px;height:14px;"></i> Post</button>
        </div>
      </div>

      <div id="communityPosts"></div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <script src="{% static 'js/app.js' %}"></script>
  <script>
    let userName = 'Traveler';
    let posts = [];
    let sortMode = 'newest';

    // User info
    (async()=>{try{const r=await fetch('/api/profile/');if(r.ok){const u=await r.json();userName=`${u.firstName||''} ${u.lastName||''}`.trim()||'Traveler';document.getElementById('sidebarName').textContent=userName;document.getElementById('sidebarAvatar').textContent=userName.charAt(0).toUpperCase();}}catch(e){}})();

    // Load posts from backend
    async function loadPosts() {
      try {
        const r = await fetch('/api/community/');
        if (!r.ok) throw new Error();
        const d = await r.json();
        posts = (d.posts||[]).map(p => ({
          id: p.id, author: p.author, initials: p.initials||p.author.charAt(0),
          time: timeAgo(p.createdAt), trip: p.tripName||'',
          text: p.text, likes: p.likes||0, comments: p.comments||0,
        }));
        renderPosts();
      } catch(e) { console.error('Load community error:', e); }
    }

    function timeAgo(iso) {
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff/60000);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins/60);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(hrs/24);
      return `${days}d ago`;
    }

    function renderPosts() {
      const container = document.getElementById('communityPosts');
      const search = document.getElementById('communitySearch').value.toLowerCase();
      container.innerHTML = '';
      let filtered = posts.filter(p => {
        if (search && !p.text.toLowerCase().includes(search) && !p.author.toLowerCase().includes(search)) return false;
        return true;
      });
      if (sortMode === 'popular') filtered.sort((a,b) => b.likes - a.likes);

      if (filtered.length === 0) {
        container.innerHTML = '<div class="glass-card p-6" style="text-align:center;"><p class="text-muted">No posts yet. Be the first to share!</p></div>';
      }

      filtered.forEach((p, i) => {
        const post = document.createElement('div');
        post.className = `community-post glass-card glass-card--glow animate-fadeInUp delay-${Math.min((i%4)+1,4)}`;
        post.innerHTML = `
          <div class="community-post__avatar">${p.initials}</div>
          <div class="community-post__content">
            <div class="community-post__header">
              <span class="community-post__author">${p.author}</span>
              <span class="community-post__time">${p.time}</span>
            </div>
            ${p.trip ? `<div class="community-post__trip-tag"><i data-lucide="map-pin" style="width:12px;height:12px;"></i> ${p.trip}</div>` : ''}
            <div class="community-post__text">${p.text.replace(/\n/g, '<br>')}</div>
            <div class="community-post__actions">
              <span class="community-post__action" onclick="likePost(${p.id}, this)"><i data-lucide="heart" style="width:14px;height:14px;"></i> <span>${p.likes}</span></span>
              <span class="community-post__action"><i data-lucide="message-circle" style="width:14px;height:14px;"></i> ${p.comments}</span>
              <span class="community-post__action" onclick="showToast('Link copied!','success')"><i data-lucide="share-2" style="width:14px;height:14px;"></i> Share</span>
            </div>
          </div>`;
        container.appendChild(post);
      });
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    async function likePost(id, el) {
      const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';
      try {
        const r = await fetch(`/api/community/${id}/like/`, { method:'POST', headers:{'X-CSRFToken':csrf} });
        if (r.ok) {
          const d = await r.json();
          el.style.color = 'var(--cyan)';
          el.querySelector('span').textContent = d.likes;
          const p = posts.find(x => x.id === id);
          if (p) p.likes = d.likes;
        }
      } catch(e){}
    }

    document.getElementById('newPostBtn').addEventListener('click', () => {
      const c = document.getElementById('postComposer');
      c.style.display = c.style.display === 'none' ? 'block' : 'none';
      if (c.style.display === 'block') document.getElementById('postText').focus();
    });

    document.getElementById('submitPostBtn').addEventListener('click', async () => {
      const text = document.getElementById('postText').value.trim();
      if (!text) return;
      const tripName = document.getElementById('postTripName').value.trim();
      const csrf = document.cookie.match(/csrftoken=([^;]+)/)?.[1]||'';
      try {
        const r = await fetch('/api/community/', {
          method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
          body: JSON.stringify({ text, tripName }),
        });
        if (r.ok) {
          document.getElementById('postText').value = '';
          document.getElementById('postTripName').value = '';
          document.getElementById('postComposer').style.display = 'none';
          loadPosts();
          showToast('Post shared! 🎉', 'success');
        }
      } catch(e){ showToast('Failed to post','error'); }
    });

    document.getElementById('communitySearch').addEventListener('input', () => renderPosts());
    document.getElementById('sortByBtn').addEventListener('click', () => {
      sortMode = sortMode === 'newest' ? 'popular' : 'newest';
      renderPosts();
      showToast(`Sorted by ${sortMode}`, 'info');
    });

    loadPosts();
  </script>
</body>
</html>
